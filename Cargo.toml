[package]
name = "rust-music-player"
version = "0.1.0"
edition = "2024"

[dependencies]
rodio = {version = "0.22.2", features = ["symphonia-isomp4", "symphonia-all"]}
slint = "1.17.1"

[build-dependencies]
slint-build = "1.17.1"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
string_slice = "warn"
